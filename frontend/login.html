<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login de usuarios</title>
    <link rel="stylesheet" href="css/formularios.css">
</head>
<body>

    <div class="caja-formulario">
        <h1 class="titulo-principal">FitLive</h1>
        <h4 class="titulo-form">Login de usuarios</h4>

        <form class="formulario" id="formulario-login">
            <div class="seccion-form">
                <label for="alias">Alias</label>
                <input name="alias" type="text" class="campo-form" placeholder="Escribe aquí tu alias">
            </div>

            <div class="seccion-form">
                <label for="clave">Contraseña</label>
                <input name="clave" type="password" class="campo-form" placeholder="Escribe aquí tu contraseña">
            </div>

            <a class="enlace-form" href="registro.html">¿no tienes una cuenta?</a>

            <input type="submit" class="boton" value="Ingresar">


        </form>

    </div>
    
    <script src=""></script>
</body>
</html>
