<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registro de usuarios</title>
    <link rel="stylesheet" href="css/formularios.css">
</head>
<body>

    <div class="caja-formulario">
        <h1 class="titulo-principal">FitLive</h1>
        <h4 class="titulo-form">Registro de usuarios</h4>

        <form class="formulario" id="formulario-registro">
            <div class="seccion-form">
                <label for="alias">Alias</label>
                <input name="alias" type="text" class="campo-form" placeholder="Xepraz">
            </div>

            <div class="seccion-form">
                <label for="clave">Contraseña</label>
                <input name="clave" type="password" class="campo-form" placeholder="Escribe una contraseña segura">
            </div>

            <div class="seccion-form">
                <label for="correo">Correo electrónico</label>
                <input name="correo" type="text" class="campo-form" placeholder="Escribe tu correo electrónico">
            </div>
            <label id="complementario">Datos complementarios</label>

            <div class="seccion-form seccion-form-flex">
                <input type="number" class="campo-form campo-peque" placeholder="Edad">
                <input type="text" class="campo-form campo-peque" placeholder="Nacionalidad">
            </div>

            <a class="enlace-form" href="login.html">¿ya tienes una cuenta?</a>

            <input type="submit" class="boton" value="Registrar">
        </form>

        

    </div>
    

    <script src=""></script>
</body>
</html>
